name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Permite que release.yml exija estas pruebas antes de publicar.
  workflow_call:

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'mcp_server/requirements*.txt'

      - name: Install Python dependencies
        working-directory: mcp_server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      # test_exe.py y test_claude_config.ps1 necesitan el ejecutable congelado. Además,
      # empaquetarlo aquí es lo que detecta los imports dinámicos que PyInstaller no ve.
      - name: Build MCP server executable
        working-directory: mcp_server
        run: pyinstaller --noconfirm inventor-mcp.spec

      # run_all.ps1 compila el add-in y los proyectos de prueba, arranca el host del pipe,
      # ejecuta las 6 baterías y devuelve código distinto de cero si algo falla.
      # Sin venv en el runner, detecta el `python` del PATH por sí solo.
      - name: Run test suite
        shell: pwsh
        run: .\tests\run_all.ps1

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            mcp_server/build/inventor-mcp/warn-inventor-mcp.txt
          if-no-files-found: ignore
