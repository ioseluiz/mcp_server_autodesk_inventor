name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # No se publica un instalador sin que pase la batería de pruebas.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-release:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          # VERSION admite sufijos de prerelease (1.2.0-beta1); NUMERIC no, porque
          # AssemblyVersion y FileVersion solo aceptan números.
          $version = "${{ github.ref_name }}".TrimStart('v')
          $numeric = ($version -split '-')[0]
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "NUMERIC=$numeric" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Sin Inventor instalado, el .csproj cae al interop de lib/. Ese DLL debe ser el de
      # Inventor 2026 (versión 30.x): con el de 2024 el build pasa igualmente, porque un
      # interop COM solo aporta definiciones de tipos, pero no valida la API real.
      #
      # Se usa `dotnet build` y no `publish` a propósito: el add-in no tiene dependencias
      # NuGet, así que publish no añadiría nada y sí movería la salida a un subdirectorio
      # distinto del que espera setup.iss.
      - name: Build plugin (Release x64)
        run: >
          dotnet build inventor_plugin/InventorMCPBridge.csproj
          -c Release
          -p:Platform=x64
          -p:AssemblyVersion=${{ steps.version.outputs.NUMERIC }}
          -p:FileVersion=${{ steps.version.outputs.NUMERIC }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Produce mcp_server/dist/inventor-mcp.exe, que es de donde lo toma setup.iss.
      - name: Build MCP server executable
        working-directory: mcp_server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          pyinstaller --noconfirm inventor-mcp.spec

      # setup.iss usa los identificadores "x64compatible", que exigen Inno Setup >= 6.3.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem `
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", `
            "C:\Program Files\Inno Setup 6\ISCC.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "No se encontró ISCC.exe tras instalar Inno Setup." }
          & $iscc.FullName /DAppVersion="${{ steps.version.outputs.VERSION }}" installer\setup.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Inventor MCP Bridge v${{ steps.version.outputs.VERSION }}"
          files: installer/output/InventorMCPBridgeSetup-*.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
